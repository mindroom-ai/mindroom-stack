# MindRoom Configuration
# Stack variant using Anthropic Claude Opus as the default model.
# This keeps the full Mind agent workspace while preserving a fast
# local onboarding flow for fresh users.

models:
  # Default stack model: Anthropic Claude Opus.
  # To switch providers, uncomment one named preset below and point
  # agents/router at that model key, or rename the preset to `default`.
  # Set matching credentials in `.env` or in the MindRoom dashboard UI.
  #
  # OpenAI (needs OPENAI_API_KEY):
  # openai_gpt:
  #   provider: openai
  #   id: gpt-6-astra
  #   context_window: 1050000
  #
  # OpenRouter (needs OPENROUTER_API_KEY):
  # openrouter_sonnet:
  #   provider: openrouter
  #   id: anthropic/claude-sonnet-5.5
  #   context_window: 1000000
  #
  # Codex CLI subscription auth (run `codex login`):
  # codex_gpt:
  #   provider: codex
  #   id: gpt-6.1-sol
  #   context_window: 258000
  #   extra_kwargs:
  #     reasoning_effort: medium
  #
  # Local Ollama on the Docker host (run `ollama pull gemma4`). MindRoom
  # reaches it through OLLAMA_HOST, which defaults to
  # http://host.docker.internal:11434 in this stack.
  # ollama_gemma:
  #   provider: ollama
  #   id: gemma4
  #   context_window: 32768
  #   extra_kwargs:
  #     options:
  #       num_ctx: 32768
  # ollama_qwen:
  #   provider: ollama
  #   id: qwen3.8:27b
  #   context_window: 32768
  #   extra_kwargs:
  #     options:
  #       num_ctx: 32768
  #
  # Local llama.cpp server on the Docker host. Port 8080 is the stack's
  # client port, so start it on another one, for example:
  # llama-server -hf unsloth/gemma-4-26B-A4B-it-GGUF:UD-Q4_K_M --host 0.0.0.0 --port 8081
  # llama_cpp_gemma:
  #   provider: llama_cpp
  #   id: unsloth/gemma-4-26B-A4B-it-GGUF:UD-Q4_K_M
  #   context_window: 128000
  #   extra_kwargs:
  #     api_key: sk-no-key-required
  #     base_url: http://host.docker.internal:8081/v1
  # llama_cpp_qwen:
  #   provider: llama_cpp
  #   id: unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL
  #   context_window: 256000
  #   extra_kwargs:
  #     api_key: sk-no-key-required
  #     base_url: http://host.docker.internal:8081/v1
  #
  # Azure OpenAI (id is your deployment name):
  # azure_openai_deployment:
  #   provider: azure
  #   id: your-azure-openai-deployment
  #
  # Amazon Bedrock Claude (uses AWS env/profile):
  # bedrock_claude_opus:
  #   provider: bedrock_claude
  #   id: anthropic.claude-opus-5-5
  #   context_window: 1000000
  #
  # Vertex AI Claude (needs GCP auth):
  # vertex_claude_sonnet:
  #   provider: vertexai_claude
  #   id: claude-sonnet-5-5
  #   context_window: 1000000
  #
  # Other Anthropic options for this provider:
  # anthropic_fable:
  #   provider: anthropic
  #   id: claude-fable-5-1
  #   context_window: 1000000
  # anthropic_sonnet:
  #   provider: anthropic
  #   id: claude-sonnet-5-5
  #   context_window: 1000000
  # anthropic_haiku:
  #   provider: anthropic
  #   id: claude-haiku-5-5
  #   context_window: 1000000
  default:
    provider: anthropic
    id: claude-opus-5-5
    context_window: 1000000

agents:
  assistant:
    display_name: Assistant
    role: A helpful general-purpose assistant
    model: default
    rooms:
      - lobby
    accept_invites: true
    access:
      current_room_members: true
    tools: []
    instructions:
      - Be helpful and conversational
  mind:
    display_name: Mind
    role: Personal assistant with persistent file-based identity and memory
    model: default
    include_default_tools: false
    memory_backend: file
    rooms:
      - personal
    accept_invites: true
    access:
      current_room_members: true
    context_files:
      - SOUL.md
      - AGENTS.md
      - USER.md
      - IDENTITY.md
      - TOOLS.md
      - HEARTBEAT.md
    tools:
      - shell
      - coding
      - memory
      - duckduckgo
      - website
      - browser
      - scheduler
      - matrix_message
      - thread_tags
      - config_manager
    skills:
      - mindroom-docs
    instructions:
      - You wake up fresh each session with no memory of previous conversations. Your context files are already loaded into your system prompt.
      - Important long-term context is persisted by the configured MindRoom memory backend. If something must be preserved exactly, write or update the relevant file directly.
      - MEMORY.md is curated long-term memory; daily files are short-lived notes and logs.
      - Ask before external or destructive actions.
      - Before answering prior-history questions, use search_memories first.
      - When helping with MindRoom setup, follow AGENTS.md and check the live state; don't guess.
      - Meet the user at their technical level. If they ask you to configure something, do it; skip YAML or shell details unless they ask.

router:
  model: default
  accept_invites: true
  access:
    current_room_members: true

# Set username before first run; once created, it cannot be changed.
# You can still change display_name later.
mindroom_user:
  username: mindroom_user
  display_name: MindRoomUser

room_defaults:
  join_policy: public
  listed: true

rooms:
  # Descriptions are also the room topics, so creating the rooms needs no model call.
  lobby:
    description: Shared lobby with the Assistant agent 👋
  personal:
    description: Chat with Mind, who remembers across sessions 🧠

matrix_space:
  enabled: true
  name: MindRoom

# File-based memory requires no external LLM. MEMORY.md is loaded into the
# prompt preamble through memory.file.max_entrypoint_lines; semantic search
# indexes the daily memory/*.md files with the local sentence-transformers
# runtime, so no separate embedding API key is required by default.
memory:
  backend: file
  embedder:
    provider: sentence_transformers
    config:
      model: sentence-transformers/all-MiniLM-L6-v2
  file:
    max_entrypoint_lines: 200
  search:
    mode: semantic
    include:
      - memory/**/*.md
    include_entrypoint: false
  auto_flush:
    enabled: true

# Stack default: open local dev lobby.
# Any registered user on this local homeserver can join managed rooms and talk to agents.
# The normal hosted/local `mindroom config init` + `mindroom connect` flow is owner-scoped instead.
# That flow writes owner placeholders into the membership access fields and replaces them with the paired Matrix account.
#
# Owner-only template for this Docker stack:
# 1. Replace @your-user:matrix.localhost with your Matrix account.
# 2. Change the active room_defaults above to join_policy: invite and listed: false.
# 3. Add invite_users under room_defaults:
# invite_users:
#   - "@your-user:matrix.localhost"
# 4. Change every active access block above to:
# access:
#   current_room_members: false
#   users:
#     - "@your-user:matrix.localhost"
# 5. Add credential managers to agents whose requester-scoped credentials the owner may manage:
# credential_managers:
#   - "@your-user:matrix.localhost"
# 6. Add the platform administrator:
# administrators:
#   - "@your-user:matrix.localhost"

defaults:
  # Lets the shell run in the MindRoom process while it has no worker. Its
  # commands can read MindRoom's keys and data, for everyone Mind answers;
  # see the owner-only template above.
  allow_shell_without_worker: true
  tools:
    - scheduler
  markdown: true
  compaction:
    enabled: true

timezone: America/Los_Angeles
