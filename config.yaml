# MindRoom Configuration
# Stack variant using Anthropic Claude Opus as the default model.
# This keeps the full Mind agent workspace while preserving a fast
# local onboarding flow for fresh users.

models:
  # Default stack model: Anthropic Claude Opus.
  # To switch providers, uncomment one named preset below and point
  # agents/router at that model key, or rename the preset to `default`.
  # Set matching credentials in `.env` or in the MindRoom dashboard UI.
  #
  # OpenAI (needs OPENAI_API_KEY):
  # openai_gpt:
  #   provider: openai
  #   id: gpt-5.5
  #   context_window: 258000
  #
  # OpenRouter (needs OPENROUTER_API_KEY):
  # openrouter_sonnet:
  #   provider: openrouter
  #   id: anthropic/claude-sonnet-4.6
  #   context_window: 1000000
  #
  # Codex CLI subscription auth (run `codex login`):
  # codex_gpt:
  #   provider: codex
  #   id: gpt-5.5
  #   context_window: 258000
  #   extra_kwargs:
  #     reasoning_effort: medium
  #
  # Local Ollama (run `ollama pull gemma4`):
  # ollama_gemma:
  #   provider: ollama
  #   id: gemma4
  #   context_window: 128000
  #   host: http://localhost:11434
  # ollama_qwen:
  #   provider: ollama
  #   id: qwen3.6:27b
  #   context_window: 256000
  #   host: http://localhost:11434
  #
  # Local llama.cpp OpenAI-compatible server:
  # llama_cpp_gemma:
  #   provider: openai
  #   id: unsloth/gemma-4-26B-A4B-it-GGUF:UD-Q4_K_M
  #   context_window: 128000
  #   extra_kwargs:
  #     api_key: sk-no-key-required
  #     base_url: http://localhost:8080/v1
  # llama_cpp_qwen:
  #   provider: openai
  #   id: unsloth/Qwen3.6-27B-GGUF:UD-Q4_K_XL
  #   context_window: 256000
  #   extra_kwargs:
  #     api_key: sk-no-key-required
  #     base_url: http://localhost:8080/v1
  #
  # Azure OpenAI (id is your deployment name):
  # azure_openai_deployment:
  #   provider: azure
  #   id: your-azure-openai-deployment
  #
  # Amazon Bedrock Claude (uses AWS env/profile):
  # bedrock_claude_opus:
  #   provider: bedrock_claude
  #   id: anthropic.claude-opus-4-8
  #   context_window: 1000000
  #
  # Vertex AI Claude (needs GCP auth):
  # vertex_claude_sonnet:
  #   provider: vertexai_claude
  #   id: claude-sonnet-4-6
  #   context_window: 1000000
  #
  # Other Anthropic options for this provider:
  # anthropic_sonnet:
  #   provider: anthropic
  #   id: claude-sonnet-4-6
  #   context_window: 1000000
  # anthropic_haiku:
  #   provider: anthropic
  #   id: claude-haiku-4-5
  #   context_window: 200000
  default:
    provider: anthropic
    id: claude-opus-4-8
    context_window: 1000000

agents:
  assistant:
    display_name: Assistant
    role: A helpful general-purpose assistant
    model: default
    rooms:
      - lobby
    accept_invites: true
    tools: []
    instructions:
      - Be helpful and conversational
  mind:
    display_name: Mind
    role: Personal assistant with persistent file-based identity and memory
    model: default
    include_default_tools: false
    learning: false
    memory_backend: file
    rooms:
      - personal
    accept_invites: true
    context_files:
      - SOUL.md
      - AGENTS.md
      - USER.md
      - IDENTITY.md
      - TOOLS.md
      - HEARTBEAT.md
    tools:
      - shell
      - coding
      - memory
      - duckduckgo
      - website
      - browser
      - scheduler
      - subagents
      - matrix_message
      - thread_tags
    skills:
      - mindroom-docs
    instructions:
      - You wake up fresh each session with no memory of previous conversations. Your context files are already loaded into your system prompt.
      - Important long-term context is persisted by the configured MindRoom memory backend. If something must be preserved exactly, write or update the relevant file directly.
      - MEMORY.md is curated long-term memory; daily files are short-lived notes and logs.
      - Ask before external or destructive actions.
      - Before answering prior-history questions, use search_memories first.

router:
  model: default
  accept_invites: true

# Set username before first run; once created, it cannot be changed.
# You can still change display_name later.
mindroom_user:
  username: mindroom_user
  display_name: MindRoomUser

matrix_room_access:
  mode: multi_user
  multi_user_join_rule: public
  publish_to_room_directory: true
  invite_only_rooms: []
  reconcile_existing_rooms: false

matrix_space:
  enabled: true
  name: MindRoom

matrix_delivery:
  ignore_unverified_devices: false

# File-based memory requires no external LLM. MEMORY.md is loaded into the
# prompt preamble through memory.file.max_entrypoint_lines; semantic search
# indexes the daily memory/*.md files with the local sentence-transformers
# runtime, so no separate embedding API key is required by default.
memory:
  backend: file
  embedder:
    provider: sentence_transformers
    config:
      model: sentence-transformers/all-MiniLM-L6-v2
  file:
    max_entrypoint_lines: 200
  search:
    mode: semantic
    include:
      - memory/**/*.md
    include_entrypoint: false
  auto_flush:
    enabled: true

authorization:
  # Stack default: open local dev lobby.
  # Any registered user on this local homeserver can join managed rooms and talk to agents.
  # The normal hosted/local `mindroom config init` + `mindroom connect` flow is owner-scoped instead.
  # That flow writes owner placeholders in `global_users` and `agent_reply_permissions`,
  # then replaces them with the paired Matrix account during `mindroom connect`.
  #
  # Owner-only template for this Docker stack:
  # 1. Replace @your-user:matrix.localhost with your Matrix account.
  # 2. Set the active `default_room_access` below to false.
  # 3. Uncomment `global_users` and `agent_reply_permissions`.
  # global_users:
  #   - "@your-user:matrix.localhost"
  # agent_reply_permissions:
  #   "*":
  #     - "@your-user:matrix.localhost"
  default_room_access: true

defaults:
  tools:
    - scheduler
  markdown: true
  compaction:
    enabled: true

timezone: America/Los_Angeles
